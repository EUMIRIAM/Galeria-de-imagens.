<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria de imagens</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Minha Galeria de Imagens.</h1>

    <div class="galeria">
      <div class="foto">
        <img
          id="img01"
          src="img/figuras-geometricas.jpg"
          alt="foto com figuras geométrica"
        />
      </div>
      <div class="foto">
        <img
          id="img02"
          src="img/triangulo.avif"
          alt="casa em formato de um triângulo"
        />
      </div>
      <div class="foto">
        <img
          id="img03"
          src="img/quadrilateros.webp"
          alt="objeto em formato de quadrilátero"
        />
      </div>
      <div class="foto">
        <img
          id="img04"
          src="img/pentagono.webp"
          alt="objeto em formato de pentágono"
        />
      </div>
      <div class="foto">
        <img
          id="img05"
          src="img/hexagono.jpg"
          alt="objeto de decoração em formato de hexágono"
        />
      </div>
      <div class="foto">
        <img
          id="img06"
          src="img/heptagono.jpg"
          alt="estrutura de um predio em formato de heptagono"
        />
      </div>
      <div class="foto">
        <img
          id="img07"
          src="img/octogono.webp"
          alt="relógio de parede em formato de octógono"
        />
      </div>
      <div class="foto">
        <img
          id="img08"
          src="img/Eneagono.jpg"
          alt="desenho pontilhado em formato de decágono"
        />
      </div>
      <div class="foto">
        <img
          id="img09"
          src="img/cone.webp"
          alt="imagem de dois cones de sinalização"
        />
      </div>
      <!-- O modal (caixa de diálogo)-->
      <div id="meuModal" class="modal">
        <span class="fechar">&times;</span>

        <img class="modal-conteudo" id="imagemAmpliada" />
      </div>
    </div>
  </body>
</html>
